services:
  db:
    image: postgres:15-alpine
    container_name: xeno-db
    environment:
      POSTGRES_USER: xenouser
      POSTGRES_PASSWORD: xenopass
      POSTGRES_DB: xenodb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xenouser -d xenodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xeno-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/xenodb
      - SPRING_DATASOURCE_USERNAME=xenouser
      - SPRING_DATASOURCE_PASSWORD=xenopass
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - APIFY_API_KEY=${APIFY_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xeno-frontend
    ports:
      - "5178:80"
    depends_on:
      - backend

volumes:
  pgdata: