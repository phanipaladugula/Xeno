# Application Configuration
server.port=8080
spring.application.name=xeno-agent

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/xenodb
spring.datasource.username=xenouser
spring.datasource.password=xenopassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# API Keys Configuration (can be overridden with environment variables)
openrouter.api.key=${OPENROUTER_API_KEY:}
apify.api.key=${APIFY_API_KEY:}

# Logging Configuration
logging.level.com.xeno.agent=INFO
logging.level.org.springframework.web=INFO

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin