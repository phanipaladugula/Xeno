# Application Configuration
server.port=8080
spring.application.name=xeno-agent

# API Keys Configuration (can be overridden with environment variables)
openrouter.api.key=${OPENROUTER_API_KEY:}
apify.api.key=${APIFY_API_KEY:}

# Logging Configuration
logging.level.com.xeno.agent=INFO
logging.level.org.springframework.web=INFO

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# Default profile (use 'dev' for H2, 'postgres' for PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}