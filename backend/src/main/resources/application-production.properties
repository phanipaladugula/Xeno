# Production Configuration for Xeno Agent

# Server Configuration
server.port=8080
server.address=0.0.0.0

# Application
spring.application.name=xeno-agent
spring.profiles.active=production

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/xenodb}
spring.datasource.username=${DB_USERNAME:xenouser}
spring.datasource.password=${DB_PASSWORD:xenopassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20

# API Keys Configuration
openrouter.api.key=${OPENROUTER_API_KEY:}
apify.api.key=${APIFY_API_KEY:}

# Logging Configuration
logging.level.root=INFO
logging.level.com.xeno.agent=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=/var/log/xeno-agent/application.log

# Security
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:}

# CORS Configuration
cors.allowed.origins=${CORS_ORIGINS:https://xeno.ai,https://app.xeno.ai}

# Actuator for monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized